add_newline = false
palette = "mythos"

format = """
ㅤ
$directory$git_branch$cmd_duration
$character"""

[palettes.mythos]
white = "#FFFFFF"
grayish = "#BFBFBF"
gray = "#9C9C9C"
nix_blue = "#79acd1"

[directory]
style = "gray bold"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "white bold"
format = "[$path ]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = "󰊢 "
style = "grayish bold"
format = "[$symbol$branch ]($style)"

[cmd_duration]
min_time = 500
style = "grayish bold"
format = "[󰔚 $duration ]($style)"

[character]
success_symbol = "[\U000F1105  ](fg:5)[感 ↝](white)"
error_symbol   = "[\U000F1105  ](fg:5)[感 ↝](white)"

[package]
disabled = true
