general {
    lock_cmd = ryoku-shell lock
    inhibit_sleep = 0
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 180
    on-timeout = ryoku-idle on-ac && brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

listener {
    timeout = 900
    on-timeout = ryoku-idle on-ac && ryoku-shell lock
}

listener {
    timeout = 420
    on-timeout = ryoku-idle on-ac && ryoku-idle output-off
    on-resume = ryoku-idle output-on
}
