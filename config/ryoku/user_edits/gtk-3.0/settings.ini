[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=int_clay
gtk-font-name=Space Grotesk 11
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=24
gtk-toolbar-style=GTK_TOOLBAR_ICONS
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=0
gtk-menu-images=0
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-application-prefer-dark-theme=1
# A bare Wayland session runs no xsettings daemon, so the theme, icon, cursor
# and font names never reach apps that read only ~/.config/gtk-3.0/settings.ini
# (they never see gsettings). This file is that on-disk baseline for the default
# dark session; gsettings is authoritative and the shell rewrites it on every
# palette or mode change, so a light session is correct everywhere that reads it.
#
# The theme name matters more here than in GTK 4: a GTK 3 app takes its whole
# look from it, and adw-gtk3 is the variant that derives its colours from the
# named colours the palette emits.
