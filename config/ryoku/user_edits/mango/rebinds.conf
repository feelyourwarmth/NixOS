# Generated by Ryoku Settings (Super + ,). Edit binds in the GUI, not here.
# One complete chord set: defaults, rebinds applied, unbinds removed,
# custom binds appended. mango keeps the last of a duplicate chord, so
# every chord here has exactly one winner.

bind=SUPER,w,spawn_shell,jq -e '(.barStyle // "qsbar") == "iris" and .inir.closeConfirm.enabled == true' "${XDG_CONFIG_HOME:-$HOME/.config}/ryoku/shell.json" >/dev/null 2>&1 && qs -c shell ipc call closeConfirm trigger || mmsg dispatch killclient
